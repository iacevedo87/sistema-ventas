<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sistema de Ventas{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="{{ url_for('static', filename='branding/logo.png') }}" alt="Integrated Healthcare Services">
      <h1>Integrated Healthcare Services<small>SISTEMA DE GESTIÓN</small></h1>
    </div>
    <nav>
      <a href="{{ url_for('index') }}">Inicio</a>
      <a href="{{ url_for('clientes') }}">Clientes</a>
      <a href="{{ url_for('proveedores') }}">Proveedores</a>
      <a href="{{ url_for('productos') }}">Productos</a>
      <a href="{{ url_for('trabajadores') }}">Trabajadores</a>
      <a href="{{ url_for('usuarios') }}">Usuarios</a>
      <a href="{{ url_for('ventas') }}">Ventas</a>
      <a href="{{ url_for('compras') }}">Compras</a>
      <a href="{{ url_for('tarjetas') }}">Tarjetas</a>
      <a href="{{ url_for('inventario') }}">Inventario</a>
      <a href="{{ url_for('nomina') }}">Nómina</a>
      <a href="{{ url_for('plantillas_home') }}">Plantillas SMS</a>
      <a href="{{ url_for('reportes') }}">Reportes</a>
      <a href="{{ url_for('logout') }}" style="opacity:1;font-weight:600;">🚪 Salir ({{ session.get('usuario','') }})</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Auto-salida por inactividad: si no hay clics, teclas ni movimiento del mouse
    // durante 5 minutos, cierra la sesión automáticamente.
    (function () {
      const LIMITE_MS = 5 * 60 * 1000; // 5 minutos
      let temporizador;
      function cerrarPorInactividad() {
        window.location.href = "{{ url_for('logout') }}";
      }
      function reiniciarTemporizador() {
        clearTimeout(temporizador);
        temporizador = setTimeout(cerrarPorInactividad, LIMITE_MS);
      }
      ["mousemove", "mousedown", "keydown", "scroll", "touchstart", "click"].forEach(function (evento) {
        document.addEventListener(evento, reiniciarTemporizador, { passive: true });
      });
      reiniciarTemporizador();
    })();
  </script>
</body>
</html>
